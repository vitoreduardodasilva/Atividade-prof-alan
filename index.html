<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exemplo CSS - Margin, Padding e Border</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    .container {
      background-color: #ddd;
      margin: 40px; /* Espaço externo */
      padding: 20px; /* Espaço interno */
      border: 3px solid #333; /* Borda */
    }

    .box {
      background-color: lightblue;
      padding: 15px;
      border: 2px solid blue;
      margin: 20px;
    }

    .highlight {
      background-color: lightcoral;
      padding: 10px;
      border: 2px dashed red;
      margin: 30px;
    }
  </style>
</head>
<body>

  <h1>Exemplo: Margin, Padding e Border</h1>

  <div class="container">
    <p>Este é o elemento <strong>container</strong>.</p>
    <p>Ele possui margin, padding e border.</p>

    <div class="box">
      Esta é uma caixa com margin, padding e border.
    </div>

    <div class="highlight">
      Outra caixa com valores diferentes para comparação.
    </div>
  </div>

</body>
</html>
